services:
  - type: web
    name: hbaf-office-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      # 공공데이터포털 "한국천문연구원_특일 정보" 인증키 (없으면 코드에 적힌 공휴일 목록만 사용)
      - key: HOLIDAY_API_KEY
        sync: false
      # 카카오 개발자 앱의 JavaScript 키 (법인차량 목적지 지도). 브라우저에 노출되는 키라 도메인 등록으로 보호됨
      - key: KAKAO_JS_KEY
        sync: false
      # 같은 카카오 앱의 REST API 키 (자동차 소요시간 계산). 서버에서만 쓰는 비밀키
      - key: KAKAO_REST_KEY
        sync: false
      # 데이터를 재배포/재시작 후에도 유지하고 싶다면 유료 플랜으로 바꾸고
      # Render 대시보드에서 Disk를 추가한 뒤(mount path 예: /var/data)
      # 아래 두 줄의 주석을 풀어서 그 경로를 가리키게 하세요.
      # - key: DATA_DIR
      #   value: /var/data
